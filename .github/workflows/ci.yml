name: Native numerical acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  navier-stokes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned mathematical Flow compiler
        uses: actions/checkout@v4
        with:
          repository: godofecht/FlowStudio
          ref: 97992dd98d5c260293201d4a4bb2009b8ab28046
          path: _flowstudio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Run full numerical regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile checked-in Navier-Stokes Flow source
        run: python _flowstudio/src/math_flow.py --check examples/navier_stokes.flow
      - name: Execute checked-in Navier-Stokes Flow source
        run: python _flowstudio/src/math_flow.py --grid 16 --until 0.001 examples/navier_stokes.flow
      - name: Execute real 2D Navier-Stokes simulation
        run: python solver.py --grid 32 --until 0.01 --dt 0.0001
      - name: Execute numerical semantic trace
        run: python solver.py --grid 16 --until 0.0002 --dt 0.0001 --shear --trace
      - name: Execute analytic shear mode
        run: python solver.py --grid 64 --until 0.01 --dt 0.0001 --shear

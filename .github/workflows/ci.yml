name: Native numerical acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  navier-stokes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Run full numerical regression suite
        run: python -m unittest discover -s tests -v
      - name: Execute real 2D Navier-Stokes simulation
        run: python solver.py --grid 32 --until 0.01 --dt 0.0001
      - name: Execute analytic shear mode
        run: python solver.py --grid 64 --until 0.01 --dt 0.0001 --shear

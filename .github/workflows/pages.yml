name: Interactive fluid laboratory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify numerical solver and mathematical Flow execution
        run: python -m unittest discover -s tests -p 'test_solver.py' -v
      - name: Export real solver frames
        run: python build_site_data.py
      - name: Validate browser JavaScript
        run: node --check site/app.js
      - name: Verify exported frames
        run: python -m unittest discover -s tests -p 'test_site_data.py' -v
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish interactive fluid laboratory
        id: deployment
        uses: actions/deploy-pages@v4
